name: AI-Broskyee AutoFactory (free-only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-broskyee-production
  cancel-in-progress: false

jobs:
  create-check-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      AI_VIDEO_FACTORY_ROOT: ${{ github.workspace }}
      LOCAL_LLM_MODEL: ${{ github.workspace }}/models/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_CATEGORY_ID: '28'
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION || 'v26.0' }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      AUTO_PUBLISH_ENABLED: ${{ vars.AUTO_PUBLISH_ENABLED || 'false' }}
      PIPER_MODEL: ${{ github.workspace }}/assets/voice/en_US-lessac-medium.onnx

    steps:
      - name: Check out automation source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Check available temporary runner space
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output work models assets/voice
          python - <<'PY'
          import pathlib, shutil
          root = pathlib.Path.cwd()
          free = shutil.disk_usage(root).free / (1024**3)
          size = sum(p.stat().st_size for p in root.rglob('*') if p.is_file()) / (1024**3)
          print(f'Workspace before downloads: {size:.3f} GB; runner free space: {free:.1f} GB')
          assert free >= 2.0, 'Not enough space on temporary hosted runner'
          assert size < 9.0, 'Workspace exceeds 9 GB soft limit'
          PY
          df -h .

      - name: Install free open-source tools and local model runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg curl libegl1 libegl-mesa0 libgl1 libsm6 libxi6 libxrender1 libxfixes3 libxxf86vm1
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu -r requirements.txt piper-tts
          python - <<'PY'
          import llama_cpp
          print('llama-cpp-python ready:', llama_cpp.__version__)
          PY
          blender --version | head -n 2
          ffmpeg -version | head -n 1
          piper --help >/dev/null

      - name: Restore cached small open model if available
        uses: actions/cache@v4
        with:
          path: models/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf
          key: qwen25-15b-instruct-q4km-v1

      - name: Download small local model if cache is empty
        shell: bash
        run: |
          set -euo pipefail
          MODEL='models/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf'
          if [ ! -s "$MODEL" ]; then
            curl -fL --retry 2 --connect-timeout 20 \
              'https://huggingface.co/bartowski/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf?download=true' \
              -o "$MODEL"
          fi
          test "$(stat -c%s "$MODEL")" -gt 100000000
          echo "Local model ready: $(du -h "$MODEL" | cut -f1)"

      - name: Download small English Piper voice model
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 --connect-timeout 20 \
            'https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx' \
            -o assets/voice/en_US-lessac-medium.onnx
          curl -fL --retry 2 --connect-timeout 20 \
            'https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json' \
            -o assets/voice/en_US-lessac-medium.onnx.json
          test -s assets/voice/en_US-lessac-medium.onnx
          test -s assets/voice/en_US-lessac-medium.onnx.json

      - name: Research, create, render, mix, quality-check and optionally publish
        shell: bash
        run: python app/pipeline.py

      - name: Save verified output and reports for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-broskyee-output-${{ github.run_id }}
          path: |
            output/final.mp4
            output/quality-report.json
            output/metadata.json
            output/pipeline-status.json
            output/publish-result.json
            work/last_qa_failure.txt
            work/plan.json
            work/trends.json
          if-no-files-found: ignore
          retention-days: 1
